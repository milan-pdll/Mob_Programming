<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="outer_container">
        <div id="container" class="poster-card">
            <p class="title">DIGITAL CARD</p>
            <h1>Milan Paudel</h1>
            <p class="subtitle">Scan to connect with me</p>

            <img id="qr" src="qr_image.png" alt="Milan Paudel QR code">

            <div class="actions">
                <button id="show" type="button">Show QR</button>
                <button id="hide" type="button">Hide QR</button>
            </div>
        </div>
    </div>
</body>
</html>
