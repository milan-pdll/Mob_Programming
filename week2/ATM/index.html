<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="scripts.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ATM SYSTEM</h1>

    <input type="text" id="email" placeholder="email">
    <input type="password" id="password" placeholder="password">
    <button id="login" type="button" onclick="login(document.getElementById('email').value, document.getElementById('password').value)">Login</button>
    <p id="status"></p>

    <input type="number" id="transaction-amount" min="0.01" step="0.01" placeholder="amount">
    <button id="balance" type="button" onclick="checkBalance()">Check Balance</button>
    <button id="deposit" type="button" onclick="deposit()">Deposit</button>
    <button id="withdraw" type="button" onclick="withdraw()">Withdraw</button>

    <p id="get_balance"></p>


</body>
</html>
